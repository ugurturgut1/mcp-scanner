[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-scanner"
version = "0.1.0"
description = "Static security scanner for MCP server tool manifests -- catches tool-poisoning language, hidden characters, schema/description mismatches, and rug-pull changes across scans."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ugur Turgut" }]
dependencies = [
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]
llm = [
    "anthropic>=0.70",
    "pydantic>=2",
]

[project.scripts]
mcp-scanner = "mcp_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
